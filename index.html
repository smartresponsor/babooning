<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Поймай бабуина 🐒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20152d;color:white;font-family:system-ui}main{height:100dvh;max-width:600px;margin:auto;padding:10px;display:flex;flex-direction:column}.stats{display:flex;justify-content:space-between;padding:12px;font-weight:bold}.field{position:relative;flex:1;overflow:hidden;border-radius:20px;background:#674b6c}.field img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.65)}.joke{position:absolute;top:20px;left:10px;right:10px;text-align:center;font-size:25px;font-weight:900;text-shadow:0 2px 8px black}.target{position:absolute;width:80px;height:80px;border:4px solid white;border-radius:50%;background:#ffd665;font-size:44px;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:25px;background:#24152dd9;text-align:center;padding:20px}.overlay button{padding:18px 30px;border:0;border-radius:16px;background:#ffd665;font-size:22px;font-weight:900}.hidden{display:none}footer{text-align:center;padding:8px}
</style><main><div class="stats"><span>🐒 <b id="score">0</b></span><span>⏱ <b id="time">15.0</b></span><span>🔥 ×<b id="combo">1</b></span></div><section class="field" id="field"><img id="background" alt="Бабуин"><div class="joke" id="joke">ПОЙМАЙ БАБУИНА!</div><button id="target" class="target hidden">🐒</button><div class="overlay" id="overlay"><h1 id="title">🐒 ПОЙМАЙ БАБУИНА!</h1><p id="result">15 секунд мемного кайфа</p><button id="start">🚀 ПОГНАЛИ!</button></div></section><footer>Лови кайф, не стресс ✨</footer></main>
<script>
(()=>{const $=id=>document.getElementById(id),field=$('field'),target=$('target'),overlay=$('overlay'),joke=$('joke');let active=false,score=0,hits=0,combo=0,time=15,last=0,prev=0,frame=0;
const jokes=['БАБУИН ОДОБРЯЕТ!','У МЕНЯ ЛАПКИ!','НЕ ДОГОНИШЬ!','КАЙФ ПОЙМАН!','БАБУИН НЕ БАГ, А ФИЧА!','Я ВООБЩЕ-ТО НА ОБЕДЕ!','ДЕДЛАЙН? КАКОЙ ДЕДЛАЙН?','БАБУИН ВЫШЕЛ ИЗ ЧАТА!'];
const photos=['https://images.unsplash.com/photo-1540574163026-643ea20ade25?w=900','https://images.unsplash.com/photo-1504457047772-27faf1c00561?w=900','https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=900'];
function bg(){const img=$('background');img.src=photos[hits%photos.length];img.onerror=()=>img.style.opacity='0';img.onload=()=>img.style.opacity='1'}
function move(){target.style.left=Math.round(8+Math.random()*Math.max(0,field.clientWidth-96))+'px';target.style.top=Math.round(85+Math.random()*Math.max(0,field.clientHeight-180))+'px'}
function render(){$('score').textContent=score;$('time').textContent=time.toFixed(1);$('combo').textContent=Math.max(1,combo)}
function finish(){active=false;cancelAnimationFrame(frame);target.classList.add('hidden');$('title').textContent='🏆 '+score+' ОЧКОВ';$('result').textContent='Бабуин требует реванша!';$('start').textContent='🔄 ЕЩЁ РАЗ';overlay.classList.remove('hidden')}
function tick(now){if(!active)return;time=Math.max(0,time-Math.min(.12,(now-prev)/1000));prev=now;render();if(!time)return finish();frame=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(frame);active=true;score=hits=combo=0;time=15;last=0;overlay.classList.add('hidden');target.classList.remove('hidden');joke.textContent='ЛОВИ КАЙФ!';bg();move();render();prev=performance.now();frame=requestAnimationFrame(tick)}
target.addEventListener('click',()=>{if(!active)return;const now=performance.now();combo=now-last<1100?Math.min(5,combo+1):1;last=now;hits++;score+=10*combo+(hits%5===0?50:0);joke.textContent=jokes[(hits-1)%jokes.length];bg();move();render()});$('start').addEventListener('click',start);bg();render()})();
</script>
